[package]
name = "moraebot"
version = "0.11.0"
edition = "2024"
# rusqlite 0.43 needs Rust 1.89 or newer.
rust-version = "1.89"
description = "Always-on messenger gateway that runs the omp (oh-my-pi) coding agent on your own machine"
repository = "https://github.com/useonmn/moraebot"
publish = false
default-run = "moraebot"

[[bin]]
name = "moraebot"
path = "src/main.rs"

# Holds the Slack connection for a core with messenger = "bridge" (docs/bridge.md).
[[bin]]
name = "moraebot-slack-bridge"
path = "src/bin/moraebot-slack-bridge.rs"

# Scripted stand-in for omp used by the offline tests (no required-features on purpose,
# so env!("CARGO_BIN_EXE_fake-omp") works under a plain `cargo test`).
[[bin]]
name = "fake-omp"
path = "tests/bin/fake_omp.rs"

[dependencies]
serenity = "0.12.5"
# serenity's own reqwest version: its REST client is built here with timeouts (see discord.rs).
reqwest012 = { package = "reqwest", version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.43", features = ["bundled"] }
toml = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "process", "sync", "time", "io-util", "fs", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
async-trait = "0.1"
# Reads the bot token without echo during `moraebot init`.
rpassword = "7"
# umask(2): keeps log files created by the gateway owner-only (0600).
libc = "0.2"
# HTTPS calls to the Slack Web API (auth.test, apps.connections.open, chat.postMessage)
# and the form-encoded files.getUploadURLExternal call.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "form"] }
# WebSocket client for Slack Socket Mode.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "native-tls"] }
# Stream/Sink helpers for the Socket Mode WebSocket.
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# NFKC for the memory excerpt filter, so compatibility look-alikes match the filter lists.
unicode-normalization = "0.1"
# Standard base64 for chat image attachments.
base64 = "0.22"
# Official omp RPC client, pinned to the oh-my-pi v18.20.2 commit.
# Do not replace with the crates.io crate named "omp-rpc": it is unrelated.
omp-rpc = { git = "https://github.com/can1357/oh-my-pi", rev = "7c49c11aa5bbaf3f418406583096168ad5b8c6dc" }

[dev-dependencies]
# Paused-time tests for reconnect backoff.
tokio = { version = "1.54", features = ["test-util"] }
tempfile = "3.27"
